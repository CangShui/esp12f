<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Consolas,Menlo,monospace">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#156dc7"/>
    </marker>
    <style>
      .t{font-size:13px;fill:#222}
      .h{font-size:17px;font-weight:bold;fill:#0b3d70}
      .s{font-size:11px;fill:#666}
      .pin{font-size:11px;fill:#fff;font-weight:bold}
      .box{fill:#fff;stroke:#c8d2dc;stroke-width:1.5;rx:8}
      .sw{stroke:#156dc7;stroke-width:2.2;fill:none;marker-end:url(#a)}
      .gnd{stroke:#444;stroke-width:2.2;fill:none}
      .opt{stroke:#f59e0b;stroke-width:2.2;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
      .warn{fill:#fff7ed;stroke:#f59e0b;stroke-width:1.5;rx:8}
    </style>
  </defs>

  <rect width="980" height="620" fill="#f5f7fa"/>
  <text x="24" y="34" class="h">ES12F 刷写接线图 —— CH341A(3.3V) ↔ ESP8285 模块</text>
  <text x="24" y="54" class="s">实线=必须接　虚线=仅进下载模式时需要　实物焊盘位置见 assets/board/esp-module-pads.png</text>

  <!-- CH341A -->
  <rect x="40" y="90" width="230" height="300" class="box"/>
  <text x="60" y="118" class="h">CH341A 编程器</text>
  <text x="60" y="138" class="s">跳线务必切到 3.3V</text>

  <circle cx="72" cy="176" r="11" fill="#ef4444"/><text x="72" y="180" class="pin" text-anchor="middle">1</text>
  <text x="94" y="181" class="t">TXD</text>
  <circle cx="72" cy="216" r="11" fill="#22c55e"/><text x="72" y="220" class="pin" text-anchor="middle">2</text>
  <text x="94" y="221" class="t">RXD</text>
  <circle cx="72" cy="256" r="11" fill="#111"/><text x="72" y="260" class="pin" text-anchor="middle">3</text>
  <text x="94" y="261" class="t">GND</text>
  <circle cx="72" cy="296" r="11" fill="#f59e0b"/><text x="72" y="300" class="pin" text-anchor="middle">4</text>
  <text x="94" y="301" class="t">3V3</text>
  <text x="60" y="336" class="s">DTR/RTS 不接</text>
  <text x="60" y="354" class="s">（本模块不支持自动复位）</text>

  <!-- ESP -->
  <rect x="640" y="90" width="300" height="300" class="box"/>
  <text x="660" y="118" class="h">ESP8285N08 模块</text>
  <text x="660" y="138" class="s">1MB Flash · 26MHz · MAC ec:94:cb:84:92:06</text>
  <rect x="660" y="150" width="260" height="46" fill="#eef3f8" stroke="#c8d2dc" rx="4"/>
  <text x="790" y="179" class="s" text-anchor="middle">板载 PCB 天线（勿覆盖金属）</text>

  <circle cx="668" cy="226" r="11" fill="#22c55e"/><text x="668" y="230" class="pin" text-anchor="middle">A</text>
  <text x="690" y="231" class="t">RXD  ← 接编程器 TXD</text>
  <circle cx="668" cy="262" r="11" fill="#ef4444"/><text x="668" y="266" class="pin" text-anchor="middle">B</text>
  <text x="690" y="267" class="t">TXD  → 接编程器 RXD</text>
  <circle cx="668" cy="298" r="11" fill="#111"/><text x="668" y="302" class="pin" text-anchor="middle">C</text>
  <text x="690" y="303" class="t">GND</text>
  <circle cx="668" cy="334" r="11" fill="#f59e0b"/><text x="668" y="338" class="pin" text-anchor="middle">D</text>
  <text x="690" y="339" class="t">3V3</text>
  <circle cx="668" cy="370" r="11" fill="#8b5cf6"/><text x="668" y="374" class="pin" text-anchor="middle">E</text>
  <text x="690" y="375" class="t">GPIO0（下载模式，仅刷写用）</text>

  <!-- wires -->
  <path class="sw" d="M83,176 H420 V231 H656"/>
  <path class="sw" d="M83,216 H440 V267 H656"/>
  <path class="gnd" d="M83,256 H460 V303 H656"/>
  <path class="sw" d="M83,296 H480 V339 H656"/>
  <text x="300" y="168" class="s">TXD → RXD（交叉）</text>
  <text x="300" y="288" class="s">RXD → TXD（交叉）</text>
  <text x="300" y="252" class="s">GND 共地</text>
  <text x="300" y="330" class="s">3.3V 供电</text>

  <!-- GPIO0 to GND -->
  <path class="opt" d="M656,370 H560 V430 H340"/>
  <rect x="200" y="410" width="140" height="42" fill="#fff" stroke="#f59e0b" rx="6"/>
  <text x="270" y="437" class="t" text-anchor="middle">GPIO0 → GND</text>
  <text x="352" y="424" class="s">刷写时短接，刷完断开</text>

  <!-- sequence -->
  <rect x="40" y="470" width="900" height="128" class="warn"/>
  <text x="60" y="496" class="h">进入下载模式的操作顺序（每次连接前都要重来）</text>
  <text x="60" y="522" class="t">① GPIO0 接 GND 并保持　→　② 给模块断电　→　③ 再上电　→　④ 保持 GPIO0 接地，运行刷写脚本</text>
  <text x="60" y="548" class="t">刷写完成后：断开 GPIO0 与 GND，再断电上电一次，新固件才会运行。</text>
  <text x="60" y="574" class="s">注意：板上那个按键不是 GPIO0（它是配网按钮，接 GPIO4）；按住按键上电不会进下载模式。</text>
  <text x="60" y="592" class="s">下载模式下 ESP8266 不打印启动日志，串口一个字节都没有，属正常现象。</text>
</svg>
